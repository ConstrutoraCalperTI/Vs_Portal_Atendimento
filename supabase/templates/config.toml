# Configuração local do Supabase CLI para o __APP_NAME__.
#
# ATENÇÃO: o projeto remoto (cjofyxgcuvpeeslkfawu) é COMPARTILHADO com outros sistemas da Calper.
# Nunca rode `supabase config push` a partir daqui: sobrescreveria Auth/API de todos.
# Este arquivo existe só para o deploy das Edge Functions do portal:
#   npx supabase functions deploy <nome> --project-ref cjofyxgcuvpeeslkfawu --use-api
project_id = "calper-__APP__"

[functions.__APP__-usuarios]
# Exige JWT válido; a função ainda confere o usuário e a permissão (a chave anon também é um JWT).
verify_jwt = true

[functions.__APP__-integracao-teste]
verify_jwt = true

[functions.__APP__-totvs]
verify_jwt = true
