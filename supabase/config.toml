# Configuração local do Supabase CLI para o Portal Atendimento.
#
# ATENÇÃO: o projeto remoto (cjofyxgcuvpeeslkfawu) é COMPARTILHADO com outros sistemas da Calper.
# Nunca rode `supabase config push` a partir daqui: sobrescreveria Auth/API de todos.
# Este arquivo existe só para o deploy das Edge Functions do portal:
#   npx supabase functions deploy <nome> --project-ref cjofyxgcuvpeeslkfawu --use-api
project_id = "calper-portal_atendimento"

[functions.portal_atendimento-usuarios]
# Exige JWT válido; a função ainda confere o usuário e a permissão (a chave anon também é um JWT).
verify_jwt = true

[functions.portal_atendimento-integracao-teste]
verify_jwt = true

[functions.portal_atendimento-totvs]
verify_jwt = true

[functions.portal_atendimento-zenvia]
verify_jwt = true

# Chamado pela Zenvia (sem JWT): a função confere o cabeçalho x-atendimento-chave (chave no Vault).
[functions.portal_atendimento-zenvia-webhook]
verify_jwt = false

[functions.portal_atendimento-email]
verify_jwt = true

# Security Gateway do login: chamado ANTES de existir sessão, então sem JWT. A função valida
# origem, payload, limites e bloqueio antes de chamar o Supabase Auth (docs/SEGURANCA-LOGIN.md).
[functions.portal_atendimento-auth]
verify_jwt = false

# Retorno do "Autorizar com Gmail": quem chama é o Google (sem JWT); a segurança é o state de uso único.
[functions.portal_atendimento-google-oauth]
verify_jwt = false
